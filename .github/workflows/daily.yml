name: Daily ETF Holdings Diff

on:
  schedule:
    # 9:30 PM UTC weekdays = after US market close. Adjust as needed.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit snapshots back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m agent.main

      - name: Commit new snapshots
        run: |
          git config user.name  "etf-diff-bot"
          git config user.email "etf-diff-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new snapshots."
          else
            git commit -m "snapshots: $(date -u +'%Y-%m-%d')"
            git push
          fi
